# Provider selection per data layer (task-spec sections 4 and 14.1).
# Switching a provider is a one-line change here; adapters share one interface
# per layer (src/providers/types.ts). Default = free everywhere.
#
# PAID master switch. While false, selecting a paid adapter below is a startup
# error and no paid endpoint can be reached. Every paid call is logged with its
# cost class in run.json / the runs table. THIS is the spend switch (docs/costs.md).
paid_enabled: false

# --- Section 14.1 required keys -------------------------------------------
geocoder: census        # census | nominatim | google (paid)
parcels: nc_onemap      # nc_onemap | county | regrid (paid)
drivetime: ors          # ors | valhalla | google (paid)
imagery: mapillary      # mapillary | streetview (paid)
poi: overpass           # overpass | places (paid)
crawler: fetch          # fetch | anycrawl | anycrawl_cloud (paid). fetch = plain Node fetch, nothing to host
tiles: protomaps        # protomaps (self-hosted PMTiles) | mapbox (paid)

# --- Additional layers (always free / official-source) ----------------------
zoning: arcgis          # arcgis: municipal/county ArcGIS zoning layers + config/use-tables.yaml
traffic: ncdot          # ncdot: NCDOT AADT stations
flood: fema             # fema: FEMA NFHL
social: reddit          # reddit: official Data API (fixture mailbox/feed when REDDIT_* unset)
mail: gmail             # gmail: Gmail SMTP + IMAP with an app password (fixture mailbox when GMAIL_* unset)
llm: rules              # rules | claude_agent | claude_api (paid)

# Per-adapter options. Secrets are NEVER here; they come from the environment
# (see .env.example). URLs for self-hosted services default to localhost.
options:
  census:
    base_url: https://geocoding.geo.census.gov/geocoder
    benchmark: Public_AR_Current
  nominatim:
    base_url_env: NOMINATIM_URL          # self-hosted only; public Nominatim is refused
    default_base_url: http://localhost:8080
  google:
    base_url: https://maps.googleapis.com/maps/api
  nc_onemap:
    parcels_url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1   # layer 1 = polygons; layer 0 is a point layer
  county:
    # County cadastral layers (ArcGIS MapServer). Pitt verified 2026-09-18: PittOpenData/CadastralPitt layer 0
    # "Pitt Parcels", fields NCPIN (= OneMap parno), OwnerName, Municipality, Acres, PhysicalAddress.
    layers:
      Pitt: https://gis.pittcountync.gov/gis/rest/services/PittOpenData/CadastralPitt/MapServer/0
  regrid:
    base_url: https://app.regrid.com/api/v2
  arcgis:
    # Official zoning layers, verified 2026-09-18. district_field holds the district code, resolved to a
    # use status via config/use-tables.yaml. The parcel polygon (or its centroid) is what gets queried: Census
    # geocodes sit in the street right-of-way, which zoning polygons exclude. A jurisdiction with no layer
    # here (Winterville, Ayden, Washington, Farmville, Kinston: none published) gets a pending gate and a
    # planning case, never a guessed URL. "Pitt County" is tried after the municipality for unincorporated land.
    layers:
      Greenville:
        url: https://gisonline.greenvillenc.gov/arcgis/rest/services/OpenData/MapServer/21   # Greenville_Zoning
        district_field: ZONE                                                                 # CH, CG, IU, RA20, R9S...
      Pitt County:
        url: https://gis.pittcountync.gov/gis/rest/services/PittOpenData/ZoningPitt/MapServer/0   # County Zoning
        district_field: ZONE                                                                     # empty inside town limits
  ors:
    base_url: https://api.openrouteservice.org
    profile: driving-car
  valhalla:
    base_url_env: VALHALLA_URL
    default_base_url: http://localhost:8002
  ncdot:
    # NCDOT AADT stations on ArcGIS Online (owner TrafficSurvey.NCDOT.GOV), verified live 2026-09-18. Point layers;
    # every AADT_YYYY column is a string with " " for years without a count. The adapter takes the latest
    # non-blank year and prefers the station on the site's street (fronting road / address) over the nearest one.
    url: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT__2024_AADT_Stations_published_September_2025/FeatureServer/0   # AADT_2002..AADT_2024, road text in Location
    fallback_url: https://services.arcgis.com/NuWFvHYDMVmmxMeM/arcgis/rest/services/NCDOT_AADT_Stations/FeatureServer/0   # same stations through AADT_2022, ROUTE + LOCATION text
    search_radius_m: 600
  fema:
    url: https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer/28
    sample_grid: 7                       # NxN sample points for majority-of-parcel-area
  mapillary:
    base_url: https://graph.mapillary.com
    bbox_m: 60
  streetview:
    base_url: https://maps.googleapis.com/maps/api
  overpass:
    base_url_env: OVERPASS_URL      # one URL or a comma-separated list tried in order
    default_base_url: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter   # polite: 1 req / 2s; main then kumi
    timeout_s: 60                    # Overpass-QL [timeout:N]; the HTTP timeout is N + 30 s; one retry per instance on 504/abort
    min_interval_ms: 2000
  places:
    base_url: https://maps.googleapis.com/maps/api
  fetch:
    user_agent: "dealersource/0.1 (+https://github.com/ryanflash66/dealersource)"   # polite UA naming the parent repo
    min_interval_ms: 1500                                                                # per host
    timeout_ms: 15000
  anycrawl:
    base_url_env: ANYCRAWL_URL
    default_base_url: http://localhost:8080
    user_agent: "dealersource/0.1 (+https://github.com/ryanflash66/dealersource)"
  anycrawl_cloud:
    base_url: https://api.anycrawl.dev
  reddit:
    base_url: https://oauth.reddit.com
    token_url: https://www.reddit.com/api/v1/access_token
    subreddits: [greenvillenc, ECU, NorthCarolina, Kinston, NewBern, Wilson, RockyMountNC, CommercialRealEstate, realestateinvesting]
    queries: ["for lease", "space for lease", "lot for lease", "closing", "going out of business", "vacant lot", "commercial space"]
    limit_per_query: 25
  gmail:
    smtp_host: smtp.gmail.com   # implicit TLS
    smtp_port: 465
    imap_host: imap.gmail.com   # implicit TLS
    imap_port: 993
    max_messages: 200           # newest matching messages read per run
    # mailbox: "[Gmail]/All Mail"  # default: the \All special-use folder, else INBOX
  rules: {}
  claude_agent:
    review_queue: review-queue.json      # written under --out; the scheduled agent reviews it
  claude_api:
    model: claude-opus-5
  protomaps:
    pmtiles_url_env: PMTILES_URL
  mapbox:
    style: mapbox://styles/mapbox/light-v11

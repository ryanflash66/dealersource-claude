# Business parameters (task-spec section 2). Every key is read at startup and
# validated by src/config/schema.ts. Change values here, never in code.

search:
  # Dev placeholder. The real dealership address is supplied at deploy time via
  # DEALERSOURCE_HOME_BASE and is never committed.
  home_base: "Greenville, NC 27858"
  max_drive_minutes: 60          # isochrone from home base, not a radius

rent:
  min_monthly: 600               # USD base rent, hard gate
  max_monthly: 1000              # USD base rent, hard gate; never exceeded

site:
  min_vehicle_display: 2         # cars displayable on the lot
  office_required: true          # enclosed office matters more than yard size
  shared_lot: last_resort        # exclude | last_resort | allowed

flood:
  high_risk_zones: [A, AE, AH, AO, AR, A99, V, VE]   # FEMA NFHL zones that fail the gate
  warn_subtypes: ["0.2 PCT ANNUAL CHANCE FLOOD HAZARD"]  # shaded X: warn only

dealer:
  license_status: held           # owner already holds an NC dealer license
  # NC DMV established-place-of-business requirements encoded as checks on the
  # site record (not a licensing workflow). See src/pipeline/requirements.ts.
  place_of_business_checks:
    enclosed_office: true        # permanent enclosed building/office
    display_area_min_vehicles: 2 # space to display vehicles
    sign_required: true          # permanent sign visible from the street

ranking:
  # Weights are relative; they are normalised at runtime. Order = spec priority.
  weights:
    traffic: 0.35
    visibility: 0.25
    distance: 0.20
    rent: 0.10
    competitors: 0.10
  # Reference bounds used to normalise raw values to 0..1.
  bounds:
    traffic_aadt_max: 30000      # AADT at or above this scores 1.0
    frontage_ft_max: 300         # road frontage at or above this scores 1.0 (visibility)
    competitors_max: 10          # this many dealers within radius scores 0.0

competitors:
  radius_m: 3000                 # other vehicle dealers within this radius

evidence:
  # Days before a stored fact must be re-verified. Expired evidence never
  # passes a gate and is listed under Exceptions on the dashboard.
  ttl_days:
    geocode: 365
    parcel: 365
    zoning_district: 180
    zoning_permitted: 180
    rent_monthly: 45
    office: 90
    vehicle_display: 90
    sublease_consent: 90
    flood_zone: 365
    traffic_aadt: 365
    drive_minutes: 365
    imagery: 365
    competitor_count: 180

mail:
  sender: owner                  # owner | operator (which mailbox the OAuth token belongs to)
  followup_days: 5               # never contact the same address about the same site twice within this window
  max_followups: 2               # after this many follow-ups, escalate to the dashboard
  bounce_pause_pct: 5            # auto-pause sending if 24h bounce rate exceeds this
  inbound_lookback_days: 30      # how far back to poll the mailbox for replies

# Planning / zoning departments. Only addresses derived from an official
# government page may be contacted (spec section 6). `source_url` records
# where the address was published; the deployer re-checks it before the first
# online run and sets `verified: true`. Unverified entries are still used in
# offline/fixture mode (fake mailbox) but are refused by the real Gmail adapter.
jurisdictions:
  Greenville:
    county: Pitt
    planning_email: planning@greenvillenc.gov
    source_url: https://www.greenvillenc.gov/government/planning-development-services
    verified: false
  Winterville:
    county: Pitt
    planning_email: planning@wintervillenc.com
    source_url: https://www.wintervillenc.com/departments/planning
    verified: false
  Ayden:
    county: Pitt
    planning_email: planning@ayden.com
    source_url: https://www.ayden.com/departments/planning
    verified: false
  Farmville:
    county: Pitt
    planning_email: planning@farmvillenc.gov
    source_url: https://www.farmvillenc.gov/departments/planning
    verified: false
  Kinston:
    county: Lenoir
    planning_email: planning@ci.kinston.nc.us
    source_url: https://www.ci.kinston.nc.us/planning
    verified: false
  Washington:
    county: Beaufort
    planning_email: planning@washingtonnc.gov
    source_url: https://www.washingtonnc.gov/planning-development
    verified: false
  Pitt County:
    county: Pitt
    planning_email: planning@pittcountync.gov
    source_url: https://www.pittcountync.gov/197/Planning-Development
    verified: false

schedule:
  scheduler: claude-routine      # claude-routine | github-actions | pg_cron (see docs/scheduling.md)
  cron: "30 5 * * *"             # daily, 05:30 America/New_York
  timezone: America/New_York

report:
  out_dir: out                   # digest.md and run JSON
  dashboard_data_dir: dashboard/public/data

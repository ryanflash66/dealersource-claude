# Source allowlist (task-spec section 5).
#
# The crawler REFUSES any source whose terms_status is `prohibited` or whose
# robots_txt is `disallowed`, regardless of `enabled`. Sources with
# terms_status `unclear` are also not fetched until the PM flips them to
# `allowed` explicitly (see README "Enable a grey source").
#
# robots_txt values were checked on 2026-09-16 with a plain HTTP fetch of
# /robots.txt from a non-browser user agent; notes record what was seen.
# `.example` domains are IANA-reserved and exist only so the offline fixture
# run has broker-class sources; replace them with brokers discovered by
# `npm run sources:discover` (POI query for estate agents in the search area).

sources:
  # --- Municipal / county economic development "available properties" ------
  - id: greenville-nc-available-properties
    kind: crawl
    url: https://www.greenvillenc.gov/business/economic-development/available-properties
    robots_txt: allowed
    terms_status: allowed
    enabled: false
    cadence: daily
    notes: >-
      DISABLED 2026-09-18: /business/economic-development/available-properties and
      /business/small-business-resources/find-a-building-or-site both return 404. The
      city routes property search to ZoomProspector (excluded below). Re-enable if a
      static city listings page is found.

  - id: pitt-county-available-sites
    kind: crawl
    url: https://www.pittcountync.gov/1172/Sites-Buildings
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    notes: >-
      Pitt County government site, Sites & Buildings page (URL corrected 2026-09-18;
      the previous path returned 404). Static HTML. Lists the Technology Enterprise
      Center office rooms directly; industrial sites hand off to ZoomProspector, which
      is recorded below as excluded. robots.txt only disallows admin paths (2026-09-18).

  - id: kinston-lenoir-econ-dev-properties
    kind: crawl
    url: https://www.kinstonlenoiredc.com/available-properties
    robots_txt: unknown
    terms_status: unclear
    enabled: false
    cadence: weekly
    notes: Kinston-Lenoir County EDC. Not yet checked; PM to research and flip.

  # --- Chambers of commerce -----------------------------------------------
  - id: greenville-pitt-chamber-listings
    kind: crawl
    url: https://www.greenvillenc.org/member-listings/commercial-real-estate
    robots_txt: unknown
    terms_status: unclear
    enabled: false
    cadence: weekly
    notes: >-
      Greenville-Pitt County Chamber. /robots.txt returned a 404 page on
      2026-09-16 (treated as unknown, not allowed). Member directory terms not
      reviewed.

  # --- Local brokers / property managers (broker class) --------------------
  - id: tarheel-commercial-listings
    kind: crawl
    url: https://tarheel-commercial.example/listings
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    fixture_only: true
    notes: >-
      DEMO broker source on a reserved .example domain so the offline run has
      broker-class listings. Never fetched online (fixture_only). Replace with
      brokers from sources.candidates.yaml after research.

  - id: coastal-plain-properties-listings
    kind: crawl
    url: https://coastal-plain-properties.example/available
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    fixture_only: true
    notes: DEMO property-management source (reserved .example domain), see above.

  # --- Reddit (official Data API only; web crawling is disallowed) ----------
  - id: reddit-eastern-nc
    kind: reddit
    url: https://oauth.reddit.com
    robots_txt: allowed
    terms_status: allowed
    enabled: false               # switched off by the PM 2026-09-22 (no Reddit API app yet); flip to true once REDDIT_* are set
    cadence: daily
    notes: >-
      reddit.com/robots.txt disallows ALL crawling (checked 2026-09-16), so
      only the official OAuth Data API is used, under the Developer Terms and
      Public Content Policy (free tier, 100 QPM). Subreddit list lives in
      providers.yaml options.reddit.subreddits.

  # --- Free public RSS / listing feeds -------------------------------------
  - id: nc-commerce-buildings-sites-rss
    kind: rss
    url: https://edpnc.com/feed/
    robots_txt: unknown
    terms_status: unclear
    enabled: false
    cadence: weekly
    notes: EDPNC news feed; rarely lists sub-$1k space. PM to review terms.

  # --- Manual leads entered by the owner/PM --------------------------------
  - id: manual-leads
    kind: manual
    url: file://config/manual-leads.yaml
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    notes: Hand-entered leads (drive-bys, word of mouth). Local file, no fetch.

  # --- Local broker websites (static HTML, discovered 2026-09-18) -----------
  - id: ron-harrell-commercial
    kind: crawl
    url: https://ronharrellandassociates.com/commercial-properties/
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    # audit 2026-09-22: mailto:info@ronharrellandassociates.com verbatim on `url` below
    # (page footer, "Email:" line; no redirect) and on the site home page. The only
    # address the broker publishes.
    contact_email: "info@ronharrellandassociates.com"
    cadence: daily
    notes: >-
      Ron Harrell & Associates, Greenville NC commercial broker. Static WordPress
      page listing ~10 properties (retail, flex, office, land; lease prices not
      shown). robots.txt disallows only /wp-admin/ (checked 2026-09-18). No terms
      of use published on the site.

  # --- Saved-search alert emails, read from the owner's own mailbox ---------
  # LoopNet and Crexi forbid crawling (the `loopnet` and `crexi` entries below stay
  # refused). These sources never contact either site: the owner saves a search there,
  # the site emails new matches to the owner's Gmail (GMAIL_SENDER_ADDRESS), and the
  # pipeline reads those emails over IMAP with the outreach app password. robots.txt
  # governs crawlers, which these sources do not use. Listing links are stored for a
  # human to open and are never fetched. PM direction 2026-09-22 (docs/decisions.md 28).
  # Until the Gmail app password is set they are recorded as skipped, not as errors.
  # alert_from and alert_listing_url are best guesses until the first real alert
  # arrives; check the sender domain and link shape then.
  - id: loopnet-alerts
    kind: email_alert
    url: imap://imap.gmail.com/%5BGmail%5D/All%20Mail?from=loopnet.com
    alert_from: [loopnet.com]
    alert_listing_url: 'loopnet\.com/Listing/'
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    notes: >-
      LoopNet saved-search "new listing alert" emails in the owner's Gmail. Setup: free
      LoopNet account under the owner's Gmail, search For Lease around Greenville NC
      (retail, land, flex/industrial; max price near $1,000/mo), Save, daily alerts.
      Nothing is requested from loopnet.com.

  - id: crexi-alerts
    kind: email_alert
    url: imap://imap.gmail.com/%5BGmail%5D/All%20Mail?from=crexi.com
    alert_from: [crexi.com]
    alert_listing_url: 'crexi\.com/(?:lease/)?properties/\d+'
    robots_txt: allowed
    terms_status: allowed
    enabled: true
    cadence: daily
    notes: >-
      Crexi saved-search alert emails in the owner's Gmail. Setup: free Crexi account under
      the owner's Gmail, Lease search around Greenville NC, Save search with email alerts on.
      Nothing is requested from crexi.com.

  # --- Recorded as NOT FETCHABLE by a plain crawler ------------------------
  - id: zoomprospector-pitt-county
    kind: crawl
    url: https://properties.zoomprospector.com/PITTCOUNTYNC
    robots_txt: disallowed
    terms_status: unclear
    enabled: false
    cadence: daily
    notes: >-
      Where Greenville and Pitt County send property searches. robots.txt allows
      only Googlebot and Bingbot and disallows every other agent (checked
      2026-09-18). Refused by policy. Lists industrial and office sites, not lots.

  - id: rofo-greenville
    kind: crawl
    url: https://www.rofo.com/commercial-real-estate/NC/greenville
    robots_txt: allowed
    terms_status: allowed
    enabled: false               # switched off by the PM 2026-09-22: no Greenville market, 0 listings on the first render
    render: js                   # JavaScript-rendered: local headless browser (playwright)
    cadence: daily
    notes: >-
      Aggregator, JavaScript-rendered. Re-checked 2026-09-22: robots.txt is
      "User-agent: * / Allow: /"; the Terms of Use (www.rofo.com/terms/) have no
      clause on automated access, only "do not misuse the site ... or interfere
      with its operation" and an intellectual-property clause (content "may not be
      copied or used without permission"); we extract facts (address, rent) and keep
      the page privately as evidence, one render a day. Enabled on that basis
      (PM instruction 2026-09-22). Coverage caveat found the same day: Rofo has
      pivoted to "location recommendation" briefs; Greenville is not in its sitemap
      and this URL serves the generic landing content, and its nearest NC markets
      (Rocky Mount, New Bern, Jacksonville) list 0 buildings.

  # --- Recorded as EXCLUDED so the PM can see what is left out and why -----
  - id: loopnet
    kind: crawl
    url: https://www.loopnet.com/search/commercial-real-estate/greenville-nc/for-lease/
    robots_txt: disallowed
    terms_status: prohibited
    enabled: false
    cadence: daily
    notes: >-
      LoopNet Terms of Use prohibit automated access, scraping and data
      extraction; /robots.txt itself returns 403 Access Denied to non-browser
      agents (checked 2026-09-16). Excluded.

  - id: crexi
    kind: crawl
    url: https://www.crexi.com/lease/properties/north-carolina/greenville
    robots_txt: disallowed
    terms_status: prohibited
    enabled: false
    cadence: daily
    notes: >-
      Crexi Terms of Service prohibit scraping/automated collection; site is
      behind a bot challenge (checked 2026-09-16). Excluded.

  - id: craigslist-eastern-nc
    kind: crawl
    url: https://eastnc.craigslist.org/search/off
    robots_txt: disallowed
    terms_status: prohibited
    enabled: false
    cadence: daily
    notes: >-
      Craigslist Terms of Use prohibit robots, spiders and scrapers without
      written permission; robots.txt disallows multiple paths (checked
      2026-09-16). Excluded.

  - id: facebook-marketplace
    kind: crawl
    url: https://www.facebook.com/marketplace/greenville/propertyrentals
    robots_txt: disallowed
    terms_status: prohibited
    enabled: false
    cadence: daily
    notes: >-
      facebook.com/robots.txt states collection of data through automated
      means is prohibited without express written permission; Marketplace
      also requires login (checked 2026-09-16). Excluded.
